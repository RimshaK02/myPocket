services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: pocket-ai-server
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
    env_file:
      - .env
    volumes:
      # Real-time source code sync (development mode)
      - ./src:/app/src
      - ./package.json:/app/package.json
      # Use container's node_modules
      - /app/node_modules
    restart: unless-stopped
    networks:
      - pocket-ai-network

networks:
  pocket-ai-network:
    driver: bridge
