version: '3.8'

services:
  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pocket-ai-ui
    ports:
      - "19000:19000"  # Expo Dev Server
      - "19001:19001"  # Expo Dev Tools
      - "19002:19002"  # Expo Metro Bundler
      - "8081:8081"    # Metro Bundler (alternative)
    volumes:
      - ./src/UI:/app
      - /app/node_modules
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=0.0.0.0
    stdin_open: true
    tty: true
    networks:
      - pocket-ai-network

networks:
  pocket-ai-network:
    driver: bridge
